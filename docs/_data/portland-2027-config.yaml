# Provisional dates below mirror the 2026 timeline shifted to the 2027 conference dates.
grants:
  url: ""
  ends: 'February 4, 2027'
  notification: 'February 13, 2027'

shirts:
  url: https://shirt.writethedocs.org/
  ends: "May 31, 2027"

date: # how do we handle these? human readable would be nice.
  main: "**May 2-4, 2027**"  # Excludes Saturday hike
  short: May 2-4, 2027
  tickets_live: "December 2026"
  month: May
  ends: 2027-05-04  # Last day; the site switches to post-conference the day after

  # The conference days in order. The weekday, display date, title, icon and
  # schedule key are derived from the date and kind, so only the summary and
  # the times shown before the full schedule is published are written here.
  days:
    - date: 2027-05-01
      kind: outing
      event: Hike
      summary: If you're in town early, join us for the Hike. Portland has excellent access to the woods right in the city.
    - date: 2027-05-02
      kind: writing_day
      summary: Kick off the conference with Writing Day and work with fellow documentarians on a project. Followed by the opening reception.
      hours: 9 AM-5 PM
      reception: 5-7 PM
    - date: 2027-05-03
      kind: talks
      summary: This is the main event! Hear from lots of interesting folks about all things documentation. We will have talks all day, and unconference sessions running in parallel.
      hours: 9 AM-5 PM
      unconference: 9:45 AM-5 PM
      social: 7-9 PM
    - date: 2027-05-04
      kind: talks
      summary: And the conference goes on! More talks and unconference today!
      hours: 9 AM-4 PM
      unconference: 9:45 AM-4 PM
      icon: conversation

