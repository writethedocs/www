# Data for the community pages, which is everything outside
# conf/<city>/<year>/. Conference pages have their own menus in
# docs/_templates/<year>/.

# Conferences listed on the front page, the conferences page, the events
# page, and in the header menu, soonest first. Each is the <shortcode>-<year>
# of a conference config file in this directory.
upcoming_conferences:
  - australia-2026
  - portland-2027

# The header menu. A link opens its own page; its children open in a
# dropdown. `upcoming_conferences: true` lists the conferences above.
nav:
  - text: Conferences
    link: /conf/
    children:
      - upcoming_conferences: true
      - text: All conferences
        link: /conf/
      - text: Talk videos
        link: https://www.youtube.com/c/WritetheDocs
  - text: Community
    link: /about/stay-connected/
    children:
      - text: Slack
        link: /slack/
      - text: Meetups
        link: /meetups/
      - text: Newsletter
        link: /newsletter/
      - text: Book club
        link: /book-club/
      - text: Code of Conduct
        link: /code-of-conduct/
  - text: Learn
    link: /guide/
    children:
      - text: Documentation guide
        link: /guide/
      - text: Hiring guide
        link: /hiring-guide/
      - text: Content by topic
        link: /topics/
      - text: Salary survey
        link: /surveys/
      - text: Learning resources
        link: /about/learning-resources/
  - text: Blog
    link: /blog/
  - text: About
    link: /about/about-the-org/
    children:
      - text: About us
        link: /about/about-the-org/
      - text: Team
        link: /team/
      - text: Sponsor us
        link: /sponsorship/
      - text: Contribute
        link: /contribute/
      - text: Contact
        link: /contact/

# The button at the end of the header menu.
nav_button:
  text: Join Slack
  link: /slack/

# The front page. Its prose sections ("What is Write the Docs?" and the
# links at the end) stay in docs/index.rst.
#
# In any text or link here, {slack_members}, {newsletter_subs},
# {meetup_cities} and {salary_survey[...]} are filled in from html_context
# in docs/conf.py, so the numbers live in one place.
home:
  hero:
    title: A global community of people who care about documentation
    text: >-
      Meet other documentarians at our conferences and local meetups, talk
      shop in Slack, and read our monthly newsletter.
    # Like `buttons` in a conference config.
    buttons:
      - text: Join Slack
        link: /slack/
      - text: Find a conference
        link: /conf/

  # The "Get involved" tiles. `icon` names a file in
  # docs/_templates/community/icons/. `when` shows a tile only while the
  # salary survey is open (salary_survey_open) or closed
  # (salary_survey_closed); its dates are in docs/conf.py.
  tiles:
    - title: Join our Slack
      link: /slack/
      icon: slack
      text: Over {slack_members} people hanging out and chatting about documentation.
    - title: Find a local meetup
      link: /meetups/
      icon: meetups
      text: Local and virtual groups in over {meetup_cities} cities, run by volunteers.
    - title: Read the newsletter
      link: /newsletter/
      icon: newsletter
      text: >-
        A monthly roundup of what our community is talking about, for over
        {newsletter_subs} subscribers.
    - title: Browse by topic
      link: /topics/
      icon: topics
      text: Over 700 talks and newsletter articles, on everything from API docs to getting hired.
    - title: Take the salary survey
      link: "{salary_survey[url]}"
      icon: survey
      when: salary_survey_open
      text: >-
        Anonymous pay data for documentation roles. The {salary_survey[year]}
        survey closes {salary_survey[closes]}, and <a href="/surveys/">past
        results</a> are free to read.
    - title: See the salary survey
      link: /surveys/
      icon: survey
      when: salary_survey_closed
      text: Anonymous pay data for documentation roles, published free every year.
    - title: Become a sponsor
      link: /sponsorship/
      icon: sponsor
      text: Reach documentarians through our conferences, newsletter, Slack and website.

# Photos behind the page title. A page can pick its own with a `banner`
# field: `:banner: _static/...` in reStructuredText, or `banner: _static/...`
# in Markdown front matter.
banners:
  # The front page.
  home: _static/conf/images/headers/portland-2025-group.jpg
  # By the first folder of the page path, or the page name for top-level
  # pages.
  sections:
    about: _static/conf/images/headers/2026/team.jpg
    about-us: _static/conf/images/headers/2026/team.jpg
    blog: _static/conf/images/headers/2026/news.jpg
    book-club: _static/conf/images/headers/2025/writing-day.jpg
    code-of-conduct: _static/conf/images/headers/2026/attendee-guide.jpg
    code-of-conduct-response: _static/conf/images/headers/2026/attendee-guide.jpg
    code-of-conduct-shortform-meetups: _static/conf/images/headers/2026/attendee-guide.jpg
    conf: _static/conf/images/headers/2026/speakers.jpg
    contact: _static/conf/images/headers/2026/registration.jpg
    contribute: _static/conf/images/headers/2026/writing-day.jpg
    documentarians: _static/conf/images/headers/2026/schedule.jpg
    guide: _static/conf/images/headers/2026/writing-day.jpg
    hiring-guide: _static/conf/images/headers/2026/convince-your-manager.jpg
    meetups: _static/conf/images/headers/2026/social-events.jpg
    newsletter: _static/conf/images/headers/2026/news.jpg
    organizer-guide: _static/conf/images/headers/2025/volunteer.jpg
    slack: _static/conf/images/headers/2025/unconference.jpg
    sponsorship: _static/conf/images/headers/2026/sponsors.jpg
    surveys: _static/conf/images/headers/2026/virtual.jpg
    team: _static/conf/images/headers/2026/team.jpg
    topics: _static/conf/images/headers/2025/lightning-talks.jpg
    videos: _static/conf/images/headers/2026/lightning-talks.jpg
  # Every other page gets one of these, picked by its name so it doesn't
  # change between builds.
  default:
    - _static/conf/images/headers/2026/schedule.jpg
    - _static/conf/images/headers/2026/unconference.jpg
    - _static/conf/images/headers/2026/social-events.jpg
    - _static/conf/images/headers/2025/writing-day.jpg
